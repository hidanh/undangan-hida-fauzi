<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hida & Fauzi</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Georgia, serif;
            background: #fdf8f8;
            color: #5a4545;
        }

        .cover {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

        .content {
            max-width: 500px;
        }

        .small-text {
            font-size: 16px;
            letter-spacing: 3px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 55px;
            font-weight: normal;
            margin: 10px 0;
            color: #8d6262;
        }

        .date {
            font-size: 18px;
            margin: 25px 0 35px;
        }

        button {
            padding: 13px 30px;
            border: 1px solid #c99a9a;
            border-radius: 30px;
            background: #c99a9a;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #b98585;
        }

    </style>
</head>

<body>

    <section class="cover">

        <div class="content">

            <div class="small-text">
                THE WEDDING OF
            </div>

            <h1>Hida & Fauzi</h1>

            <div class="date">
                18 September 2026
            </div>

            <button>
                Buka Undangan
            </button>

        </div>

    </section>

</body>
</html>
