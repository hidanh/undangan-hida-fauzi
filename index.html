<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hida & Fauzi</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: #ffffff;
            color: #654f4f;
            font-family: Georgia, serif;
        }


        /* =========================
           COVER
        ========================= */

        .cover {
            min-height: 100vh;
            position: relative;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 30px;

            overflow: hidden;
        }


        .content {
            width: 100%;
            max-width: 500px;

            position: relative;
            z-index: 10;
        }


        /* =========================
           TEXT COVER
        ========================= */

        .small-text {
            font-family: Arial, sans-serif;
            font-size: 13px;
            letter-spacing: 4px;

            color: #9b7777;

            margin-bottom: 25px;
        }


        .line {
            width: 70px;
            height: 1px;

            background: #cdaaaa;

            margin: 0 auto 25px;
        }


        h1 {
            font-size: 58px;
            font-weight: normal;

            line-height: 1.15;

            margin: 0;

            color: #8d6262;
        }


        .ampersand {
            font-size: 30px;
            font-style: italic;

            color: #b58b8b;

            margin: 8px 0;
        }


        .date {
            font-family: Arial, sans-serif;

            font-size: 14px;
            letter-spacing: 3px;

            margin-top: 30px;

            color: #806767;
        }


        /* =========================
           BUTTON
        ========================= */

        button {
            margin-top: 35px;

            padding: 13px 32px;

            border: none;
            border-radius: 30px;

            background: #c99a9a;

            color: white;

            font-size: 15px;

            cursor: pointer;

            transition: 0.3s;
        }


        button:hover {
            background: #b98585;
        }


        /* =========================
           BUNGA SAMPING
        ========================= */

        .bunga-samping {
            position: absolute;

            width: 180px;
            height: auto;

            z-index: 2;
        }


        .bunga-kiri {
            left: -35px;
            top: 50%;

            transform: translateY(-50%);
        }


        .bunga-kanan {
            right: -35px;
            top: 50%;

            transform: translateY(-50%) scaleX(-1);
        }


        /* =========================
           BOUQUET
        ========================= */

        .bunga-bouquet {
            position: absolute;

            width: 260px;
            height: auto;

            z-index: 3;
        }


        .bouquet-kiri {
            bottom: -45px;
            left: -45px;
        }


        .bouquet-kanan {
            bottom: -45px;
            right: -45px;

            transform: scaleX(-1);
        }


        /* =========================
           HALAMAN UTAMA
        ========================= */

        .main-content {
            display: none;

            min-height: 100vh;

            padding: 80px 25px;

            text-align: center;

            background: #ffffff;
        }


        /* =========================
           OPENING
        ========================= */

        .opening {
            max-width: 600px;

            margin: 0 auto;

            text-align: center;
        }


        .opening-small {
            font-family: Arial, sans-serif;

            font-size: 12px;

            letter-spacing: 4px;

            color: #9b7777;

            margin-bottom: 10px;
        }


        .pengantin {
            display: block;

            width: 300px;
            max-width: 80%;

            height: auto;

            margin: 10px auto 5px;
        }


        .opening h2 {
            margin: 5px 0;

            font-size: 32px;

            font-weight: normal;

            color: #8d6262;
        }


        .and {
            font-size: 28px;

            font-style: italic;

            color: #b58b8b;

            margin: 2px 0;
        }


        .opening-date {
            font-family: Arial, sans-serif;

            font-size: 13px;

            letter-spacing: 3px;

            color: #806767;

            margin-top: 25px;
        }


        .opening-text {
            max-width: 500px;

            margin: 30px auto 0;

            font-size: 15px;

            line-height: 1.8;

            color: #654f4f;
        }


        /* =========================
           TAMPILAN HP
        ========================= */

        @media (max-width: 600px) {

            h1 {
                font-size: 54px;
            }


            .small-text {
                font-size: 12px;
            }


            .bunga-samping {
                width: 125px;
            }


            .bunga-kiri {
                left: -45px;
            }


            .bunga-kanan {
                right: -45px;
            }


            .bunga-bouquet {
                width: 180px;
            }


            .bouquet-kiri {
                bottom: -30px;
                left: -40px;
            }


            .bouquet-kanan {
                bottom: -30px;
                right: -40px;
            }


            .pengantin {
                width: 280px;
            }


            .opening h2 {
                font-size: 29px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         COVER
    ========================= -->

    <section class="cover">


        <!-- BUNGA PANJANG KIRI -->

        <img
            src="bunga-samping.png"
            class="bunga-samping bunga-kiri"
        >


        <!-- BUNGA PANJANG KANAN -->

        <img
            src="bunga-samping.png"
            class="bunga-samping bunga-kanan"
        >


        <!-- BOUQUET KIRI BAWAH -->

        <img
            src="bunga-bouquet.png"
            class="bunga-bouquet bouquet-kiri"
        >


        <!-- BOUQUET KANAN BAWAH -->

        <img
            src="bunga-bouquet.png"
            class="bunga-bouquet bouquet-kanan"
        >


        <!-- ISI COVER -->

        <div class="content">


            <div class="small-text">
                THE WEDDING OF
            </div>


            <div class="line"></div>


            <h1>
                Hida
            </h1>


            <div class="ampersand">
                &
            </div>


            <h1>
                Fauzi
            </h1>


            <div class="date">
                18 SEPTEMBER 2026
            </div>


            <button onclick="bukaUndangan()">
                Buka Undangan
            </button>


        </div>

    </section>



    <!-- =========================
         HALAMAN SETELAH BUKA
    ========================= -->

    <section
        class="main-content"
        id="mainContent"
    >

        <div class="opening">


            <div class="opening-small">
                THE WEDDING OF
            </div>


            <img
                src="pengantin.png"
                class="pengantin"
            >


            <h2>
                Ahmad Fauzi
            </h2>


            <div class="and">
                &
            </div>


            <h2>
                Nur Hidayah
            </h2>


            <div class="opening-date">
                18 SEPTEMBER 2026
            </div>


            <p class="opening-text">
                Dengan memohon rahmat dan ridho Allah SWT,
                kami bermaksud mengundang Bapak/Ibu/Saudara/i
                untuk hadir dalam acara pernikahan kami.
            </p>


        </div>

    </section>



    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        function bukaUndangan() {

            document.querySelector(".cover").style.display = "none";

            document.getElementById("mainContent").style.display = "block";

            window.scrollTo(0, 0);

        }

    </script>


</body>

</html>
