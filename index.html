<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hida & Fauzi</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #fff;
            color: #654f4f;
            font-family: Georgia, serif;
        }

        /* =========================
           COVER
        ========================= */

        .cover {
            min-height: 100vh;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            overflow: hidden;
        }

        .content {
            width: 100%;
            max-width: 500px;
            position: relative;
            z-index: 10;
        }


        /* =========================
           TEXT
        ========================= */

        .small-text {
            font-family: Arial, sans-serif;
            font-size: 13px;
            letter-spacing: 4px;
            color: #9b7777;
            margin-bottom: 25px;
        }

        .line {
            width: 70px;
            height: 1px;
            background: #cdaaaa;
            margin: 0 auto 25px;
        }

        h1 {
            font-size: 58px;
            font-weight: normal;
            line-height: 1.15;
            margin: 0;
            color: #8d6262;
        }

        .ampersand {
            font-size: 30px;
            font-style: italic;
            color: #b58b8b;
            margin: 8px 0;
        }

        .date {
            font-family: Arial, sans-serif;
            font-size: 14px;
            letter-spacing: 3px;
            margin-top: 30px;
            color: #806767;
        }

        button {
            margin-top: 35px;
            padding: 13px 32px;
            border: none;
            border-radius: 30px;
            background: #c99a9a;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }


        /* =========================
           BUNGA SAMPING
        ========================= */

        .bunga-samping {
            position: absolute;
            width: 180px;
            height: auto;
            z-index: 2;
        }

        /* kiri */

        .bunga-kiri {
            left: -35px;
            top: 50%;
            transform: translateY(-50%);
        }

        /* kanan */

        .bunga-kanan {
            right: -35px;
            top: 50%;
            transform: translateY(-50%) scaleX(-1);
        }


        /* =========================
           BOUQUET
        ========================= */

        .bunga-bouquet {
            position: absolute;
            width: 260px;
            height: auto;
            z-index: 3;
        }

        /* kiri atas */

        .bouquet-kiri {
            top: -35px;
            left: -45px;
        }

        /* kanan bawah */

        .bouquet-kanan {
            bottom: -45px;
            right: -45px;
            transform: scaleX(-1);
        }


        /* =========================
           TAMPILAN HP
        ========================= */

        @media (max-width: 600px) {

            h1 {
                font-size: 54px;
            }

            .small-text {
                font-size: 12px;
            }

            .bunga-samping {
                width: 125px;
            }

            .bunga-kiri {
                left: -45px;
            }

            .bunga-kanan {
                right: -45px;
            }

            .bunga-bouquet {
                width: 180px;
            }

            .bouquet-kiri {
                top: -25px;
                left: -40px;
            }

            .bouquet-kanan {
                bottom: -30px;
                right: -40px;
            }

        }

    </style>
</head>


<body>

    <section class="cover">


        <!-- BUNGA PANJANG KIRI -->

        <img 
            src="bunga-samping.png"
            class="bunga-samping bunga-kiri"
        >


        <!-- BUNGA PANJANG KANAN -->

        <img 
            src="bunga-samping.png"
            class="bunga-samping bunga-kanan"
        >


        <!-- BOUQUET KIRI ATAS -->

        <img 
            src="bunga-bouquet.png"
            class="bunga-bouquet bouquet-kiri"
        >


        <!-- BOUQUET KANAN BAWAH -->

        <img 
            src="bunga-bouquet.png"
            class="bunga-bouquet bouquet-kanan"
        >


        <!-- ISI UNDANGAN -->

        <div class="content">

            <div class="small-text">
                THE WEDDING OF
            </div>

            <div class="line"></div>

            <h1>Hida</h1>

            <div class="ampersand">
                &
            </div>

            <h1>Fauzi</h1>

            <div class="date">
                18 SEPTEMBER 2026
            </div>

            <button>
                Buka Undangan
            </button>

        </div>

    </section>

</body>
</html>
