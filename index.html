<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hida & Fauzi</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #fdf8f8;
            color: #654f4f;
            font-family: Georgia, serif;
        }

        .cover {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

        .content {
            width: 100%;
            max-width: 500px;
        }

        .small-text {
            font-family: Arial, sans-serif;
            font-size: 13px;
            letter-spacing: 4px;
            color: #9b7777;
            margin-bottom: 25px;
        }

        .line {
            width: 70px;
            height: 1px;
            background: #cdaaaa;
            margin: 0 auto 25px;
        }

        h1 {
            font-size: 58px;
            font-weight: normal;
            line-height: 1.2;
            margin: 0;
            color: #8d6262;
        }

        .ampersand {
            font-size: 30px;
            font-style: italic;
            color: #b58b8b;
            margin: 8px 0;
        }

        .date {
            font-family: Arial, sans-serif;
            font-size: 14px;
            letter-spacing: 3px;
            margin-top: 30px;
            color: #806767;
        }

        button {
            margin-top: 35px;
            padding: 13px 32px;
            border: 1px solid #c99a9a;
            border-radius: 30px;
            background: #c99a9a;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #b98585;
        }

    </style>
</head>

<body>

    <section class="cover">

        <div class="content">

            <div class="small-text">
                THE WEDDING OF
            </div>

            <div class="line"></div>

            <h1>Hida</h1>

            <div class="ampersand">
                &
            </div>

            <h1>Fauzi</h1>

            <div class="date">
                18 SEPTEMBER 2026
            </div>

            <button>
                Buka Undangan
            </button>

        </div>

    </section>

</body>
</html>
